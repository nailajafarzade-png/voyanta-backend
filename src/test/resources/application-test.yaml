spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

voyanta:
  jwt:
    secret: test-jwt-secret-must-be-at-least-32-bytes-long
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  ai:
    provider: openai
    api-key: test-ai-key-do-not-call-real-provider
    base-url: http://127.0.0.1:9
    model: gpt-4o
    timeout: 2s
    max-retries: 0
  survey:
    session-ttl: 30m
  rate-limit:
    anonymous-plans-per-day: 2
    authenticated-plans-per-day: 5
    ai-requests-per-minute-global: 60
  storage:
    provider: s3
    bucket: test-bucket
    endpoint: ""
    access-key: ""
    secret-key: ""
    region: auto
  oauth:
    google:
      client-id: ""
  homepage:
    avg-rating: 4.9
    stats-cache-ttl: 1h
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173

sentry:
  enabled: false

logging:
  level:
    root: WARN
    com.voyanta: INFO
    org.testcontainers: INFO
    org.springframework.security: WARN
