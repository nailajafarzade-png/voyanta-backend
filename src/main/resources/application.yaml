spring:
  application:
    name: voyanta-backend

  profiles:
    active: dev

  datasource:
    # Use Docker's IPv4 loopback binding explicitly for local development.
    url: jdbc:postgresql://127.0.0.1:5432/voyanta
    username: ${DB_USERNAME:voyanta}
    password: ${DB_PASSWORD:voyanta}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # schema Flyway ilə idarə olunur, Hibernate yalnız yoxlayır
    open-in-view: false          # lazy-loading tələlərinin qarşısını alır
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# --- Bizim öz konfiqurasiya sahələrimiz ---
voyanta:
  jwt:
    secret: ${JWT_SECRET:change-this-in-production-min-256-bits-long}
    access-token-ttl: 15m
    refresh-token-ttl: 30d

  ai:
    provider: openai
    api-key: ${AI_API_KEY:}
    base-url: https://api.openai.com
    model: gpt-4o
    timeout: 15s
    max-retries: 2

  survey:
    session-ttl: 30m

  rate-limit:
    anonymous-plans-per-day: 1
    authenticated-plans-per-day: 10
    ai-requests-per-minute-global: 60

  storage:
    provider: s3
    bucket: ${STORAGE_BUCKET:voyanta-images}
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    region: ${STORAGE_REGION:auto}

  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}

  homepage:
    avg-rating: 4.9
    stats-cache-ttl: 1h

  cors:
    allowed-origins:
      - http://localhost:3000
      - https://voyanta.az
      - https://www.voyanta.az

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SPRING_PROFILES_ACTIVE:dev}
  traces-sample-rate: 0.2
  enabled: ${SENTRY_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.voyanta: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

---
# --- dev profili: local docker-compose mühiti üçün ---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.voyanta: DEBUG

---
# --- prod profili: real deployment üçün ---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.voyanta: INFO

sentry:
  enabled: true
